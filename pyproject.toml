[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "periodic-ring-descriptors"
version = "0.1.0"
description = "Interpretable periodic ring-geometry descriptors for 2D and 3D carbon networks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "networkx>=3.1",
  "pymatgen>=2023.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
paper = ["matplotlib>=3.7"]

[project.scripts]
ringdesc = "periodic_ring_descriptors.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:Issues encountered while parsing CIF.*:UserWarning",
  "ignore:Set OLD_ERROR_HANDLING.*:DeprecationWarning",
]